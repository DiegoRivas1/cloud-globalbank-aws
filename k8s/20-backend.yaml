apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: globalbank
spec:
  selector:
    app: backend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: globalbank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Reparte los pods entre nodos para que el balanceo se vea entre máquinas distintas
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      containers:
        - name: backend
          image: globalbank-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: globalbank-secrets
                  key: DB_PASSWORD
            - name: NODE_NAME              # Downward API: nodo donde corre el pod
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: APP_VERSION
              value: dev
          startupProbe:                    # da tiempo a que Postgres esté listo
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:                  # ¿puede recibir tráfico? (consulta la BD)
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:                   # ¿sigue vivo? (si falla, reinicia el contenedor)
            httpGet: { path: /healthz, port: 3000 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
