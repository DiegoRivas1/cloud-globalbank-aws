apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: globalbank
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080          # kind lo publica en http://localhost:8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: globalbank
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: globalbank-frontend:dev2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # BACKEND_HOST=backend y LOADGEN_HOST=loadgen ya coinciden con los nombres de los Services
          readinessProbe:
            httpGet: { path: /nginx-health, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /nginx-health, port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
