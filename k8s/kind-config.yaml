# Clúster local de 3 nodos. El nombre se pasa con: kind create cluster --name globalbank
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # NodePort del frontend (más adelante)
        hostPort: 8090         # http://localhost:8090
        protocol: TCP
  - role: worker
  - role: worker
