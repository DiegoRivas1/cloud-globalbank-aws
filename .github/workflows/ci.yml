name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:          # lo reutiliza el pipeline de despliegue (cd.yml)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Análisis estático (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.6.9
      - run: ruff check app

  test:
    name: Pruebas (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, loadgen, clusterview]
    defaults:
      run:
        working-directory: app/${{ matrix.component }}
    # Base de datos desechable del runner: solo la usan las pruebas de integración del backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: banco_db
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d banco_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: banco_db
      DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/${{ matrix.component }}/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt pytest-cov
      - name: Ejecutar pruebas
        run: pytest -v --junitxml=report.xml --cov=. --cov-report=xml --cov-report=term-missing
      - name: Resumen de resultados
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          comp = "${{ matrix.component }}"
          try:
              s = ET.parse("report.xml").getroot()
              s = s if s.tag == "testsuite" else s[0]
              total, fail, err, skip = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              print(f"### Pruebas de `{comp}`\n")
              print("| Total | Pasaron | Fallaron | Omitidas | Tiempo |\n|---|---|---|---|---|")
              print(f"| {total} | {total - fail - err - skip} | {fail + err} | {skip} | {float(s.get('time', 0)):.1f} s |")
          except Exception as e:
              print(f"### Pruebas de `{comp}`\n\nNo se generó el reporte: {e}")
          PY
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-${{ matrix.component }}
          path: |
            app/${{ matrix.component }}/report.xml
            app/${{ matrix.component }}/coverage.xml

  build:
    name: Imagen Docker (${{ matrix.component }})
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend, loadgen, clusterview]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t globalbank-${{ matrix.component }}:ci app/${{ matrix.component }}

  iac:
    name: Validar Terraform y manifiestos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt / init / validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
      - name: Kustomize (kind y EKS)
        run: |
          kubectl kustomize k8s/overlays/kind > /dev/null
          kubectl kustomize k8s/overlays/eks > /dev/null
